# Fast, data-free checks (Mode D). Runs the testthat suite: script parsing,
# path portability, unit tests of the benefit-risk functions, input
# validators, output comparators and the I/O sandbox. It does NOT need
# 01_Data/ or the companion CHIK_ORV_impact project and does NOT reproduce
# manuscript results (that is Mode B, run locally; see
# docs/REVIEWER_REPRODUCTION_GUIDE.md).
name: checks

on:
  push:
    branches: [main, reproducibility-nature-medicine]
  pull_request:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
          use-public-rspm: true
      - name: Install test dependencies
        run: |
          install.packages(c("testthat", "readxl", "writexl", "png"))
        shell: Rscript {0}
      - name: Run smoke tests
        run: Rscript tools/run_reproduction.R --mode smoke
